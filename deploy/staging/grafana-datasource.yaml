# Датасорс staging-стенда Grafana (palmshell): витрины v_* тем же пользователем kimi_reader,
# что ходит через MCP (readonly, гранты только на v_*).
# uid продублирован с grafana/clickhouse.go (DatasourceUID) — менять только вместе,
# иначе панели дашборда gold-thesis останутся без источника данных.
#
# ВАЖНО: это шаблон. Плейсхолдер __CLICKHOUSE_PASSWORD__ подставляется на хосте из
# /etc/clickhouse-import-rosstat.env при `make grafana-deploy-staging`; в репозитории
# пароля нет и быть не должно. Установленный файл на хосте:
# /etc/grafana/provisioning/datasources/clickhouse.yaml, root:grafana 640.
apiVersion: 1

datasources:
  - name: ClickHouse (rosstat)
    type: grafana-clickhouse-datasource
    uid: ch-rosstat
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: localhost
      port: 8123
      protocol: http
      secure: false
      username: kimi_reader
      defaultDatabase: default
    secureJsonData:
      password: "__CLICKHOUSE_PASSWORD__"
