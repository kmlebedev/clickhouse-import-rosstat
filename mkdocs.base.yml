site_name: clickhouse-import-rosstat
site_description: Импорт макростатистики и финансовых данных в ClickHouse
site_url: https://kmlebedev.github.io/clickhouse-import-rosstat/
use_directory_urls: false

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
