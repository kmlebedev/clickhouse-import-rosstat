name: Pages
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "mkdocs.base.yml"
      - "docs/**"
      - "scripts/docs_build.py"
      - "scripts/docs_build_test.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "mkdocs.base.yml"
      - "docs/**"
      - "scripts/docs_build.py"
      - "scripts/docs_build_test.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material==9.7.7
      - run: python3 scripts/docs_build.py --check
      - run: python3 scripts/docs_build_test.py
      - run: python3 scripts/docs_build.py --out build/site-docs
      - run: mkdocs build -f build/mkdocs.yml --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
