name: Sync plugin manifests

on:
  pull_request:
    paths:
      - kimi.plugin.json
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - .cursor-plugin/plugin.json
      - .cursor-plugin/marketplace.json
      - .codex-plugin/plugin.json
      - .agents/plugins/marketplace.json
      - qwen-extension.json
      - scripts/plugin_manifests.py
      - scripts/plugin_manifests_test.py
      - .github/workflows/sync-manifests.yml
  push:
    branches: [main]
    paths:
      - kimi.plugin.json
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - .cursor-plugin/plugin.json
      - .cursor-plugin/marketplace.json
      - .codex-plugin/plugin.json
      - .agents/plugins/marketplace.json
      - qwen-extension.json
      - scripts/plugin_manifests.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-plugin-manifests
  cancel-in-progress: false

jobs:
  validate:
    name: Check manifest metadata in sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check manifests
        run: python3 scripts/plugin_manifests.py --check

      - name: Test manifest checker
        run: python3 scripts/plugin_manifests_test.py

  sync:
    name: Propagate version and descriptions
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync manifests
        run: python3 scripts/plugin_manifests.py --write

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git add kimi.plugin.json \
                  .claude-plugin/marketplace.json \
                  .cursor-plugin/plugin.json .cursor-plugin/marketplace.json \
                  .codex-plugin/plugin.json .agents/plugins/marketplace.json \
                  qwen-extension.json
          git commit -m "chore: sync plugin manifests [skip ci]"
          git push
