type: chain
schedule: "17 20 * * *"
overlap_policy: skip

# Ежедневный прогон (20:17 МСК, за 6 минут до forecast.yaml 20:23). ETF-шаг
# автоматический и в сети — ручного шага в нём нет, поэтому публикация WGC
# ловится в день выхода (ряды месячные, но импорт идемпотентен, лишние прогоны
# безвредны). wgc/data для ETF — только фолбэк: ETF_Flows_*.xlsx читается
# оттуда, если API недоступно. Выгрузки ЦБ по-прежнему попадают в wgc/data
# вручную (скачивание из goldhub — только браузером): пока файлы на месте,
# ежедневный прогон идемпотентен — перезаписываются те же значения (в логе
# Imported 1942 rows of wgc_cb_reserves), а точки за новый отчётный месяц
# появляются только после очередного ручного скачивания выгрузки в wgc/data.
# Когда файлов нет вовсе, прогон печатает warn + 0 строк, и DAG остаётся
# зелёным. Шаги — цепочкой: ETF-потоки, затем резервы ЦБ (свои выгрузки
# Changes_*.xlsx и World_official_gold_holdings_*.xlsx).
steps:
  - id: wgc_etf_flows
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=wgc_etf_flows
    retry_policy:
      limit: 3
      interval_sec: 300

  - id: wgc_cb_reserves
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=wgc_cb_reserves
    retry_policy:
      limit: 3
      interval_sec: 300
