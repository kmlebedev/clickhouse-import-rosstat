type: chain
schedule: "17 20 * * *"
overlap_policy: skip

# Ежедневный прогон (20:17 МСК, за 6 минут до forecast.yaml 20:23). ETF-шаг
# автоматический и в сети — ручного шага в нём нет, поэтому публикация WGC
# ловится в день выхода (ряды месячные, но импорт идемпотентен, лишние прогоны
# безвредны). wgc/data для ETF — только фолбэк: ETF_Flows_*.xlsx читается
# оттуда, если API недоступно. Выгрузки ЦБ по-прежнему скачиваются вручную
# (goldhub отдаёт файлы только браузеру) и доставляются на staging целью
# deploy-staging-data. working_dir нужен, как в financial.yaml: dagu 2.18
# запускает шаги в dag-run-work/<dag>/<id>, откуда относительный wgc/data не
# разрешается, поэтому DAG стартует в /root/dagu и видит /root/dagu/wgc/data.
# Шаг wgc_cb_reserves идёт с WGC_REQUIRE_DATA=1: обе выгрузки (Changes_*.xlsx
# и World_official_gold_holdings_*.xlsx) обязательны, и отсутствие хотя бы
# одной — ошибка с перечнем отсутствующих масок и красный DAG вместо тихого
# warn + 0. Ручной `make import STAT=wgc_cb_reserves` без флага сохраняет
# прежнее поведение: нет обоих файлов — warn + 0 строк, частичный набор — warn
# и только доступная часть. Шаги — цепочкой: ETF-потоки, затем резервы ЦБ.
working_dir: /root/dagu

steps:
  - id: wgc_etf_flows
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=wgc_etf_flows
    retry_policy:
      limit: 3
      interval_sec: 300

  - id: wgc_cb_reserves
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=wgc_cb_reserves
      - WGC_REQUIRE_DATA=1
    retry_policy:
      limit: 3
      interval_sec: 300
