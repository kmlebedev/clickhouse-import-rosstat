type: chain
# Торговые сессии MOEX: каждые 15 минут с 09:00 до конца вечерней сессии
# (19:05–23:50 МСК) и финальный прогон после её закрытия. Расписание ежедневное:
# акции TQBR торгуются и в сессию выходного дня (сб/вс); вне сессии и в праздники
# прогон пустой и идемпотентный — пересчёт окна [watermark − 15 мин, max(time)].
schedule:
  - "*/15 9-23 * * *"
  - "55 23 * * *"
overlap_policy: skip

steps:
  - id: transaq_net_flows
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=transaq_net_flows
    retry_policy:
      limit: 3
      interval_sec: 300
