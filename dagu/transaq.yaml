type: chain
# Торговая сессия MOEX: каждые 15 минут до закрытия основной сессии и финальный
# прогон после него. Расписание ежедневное: акции TQBR торгуются и в сессию
# выходного дня (сб/вс), в праздники прогон пустой и идемпотентный. Вечерние
# сделки (19:00–23:50 МСК) догоняет утренний пересчёт окна
# [watermark − 15 мин, max(time)].
schedule:
  - "*/15 9-18 * * *"
  - "20 19 * * *"
overlap_policy: skip

steps:
  - id: transaq_net_flows
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=transaq_net_flows
    retry_policy:
      limit: 3
      interval_sec: 300
