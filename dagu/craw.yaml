type: chain
schedule: "17 * * * *"
overlap_policy: skip

# Реестр СБКТС Росстандарта (свидетельства о безопасности конструкции ТС) — прокси
# объёма импорта автомобилей: каждой ввезённой машине соответствует запись реестра.
# Транспорт — REST API портала (/standards/rest-api/libraries/search с заголовком
# gtn.access.appid), а не HTTP-листинг: портальная пагинация упирается в стену —
# from=20000 ≈ 3 с, from=100000 ≈ 10.7 с, from=150000 и глубже — стабильный таймаут
# 60 с, а текстовый query=DD.MM.YYYY отдаёт те же документы плоским дневным срезом
# любой глубины. Режим since (хвост [якорь − GOST_SETTLE_DAYS, вчера МСК], дефолт
# 3 дня) — потому что лаг «выдача → публикация» у источника ≈ 2 суток: опоздавшие
# документы обязаны догоняться, а не теряться. Прогон щадящий: 4–12 запросов в час
# (день с count > 10000 отвергается — окно поиска ручки). GOST_MODE=full (вся
# история с 2016, часы работы) и GOST_MODE=check (сверка полноты без записи) —
# ручные, в расписании их нет. GOST_APP_ID приходит из env-файла хоста — dev:
# ~/.config/rosstat/env, staging: /etc/clickhouse-import-rosstat.env (тот же файл,
# что читает deploy/staging/dagu.service; образец —
# deploy/staging/clickhouse-import-rosstat.env.example) — и в DAG не прописывается:
# значения токена в репозитории нет (правило 1). В env-файле держат только токен:
# режимные переменные (GOST_MODE/GOST_FROM/GOST_TO/GOST_SETTLE_DAYS) задаёт сам DAG
# (env шага), иначе значение из файла перекрыло бы префикс команды ручного запуска.
steps:
  - id: gost_vehicle_safety_certificate
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=gost_vehicle_safety_certificate
      - GOST_MODE=since
    retry_policy:
      limit: 3
      interval_sec: 300
