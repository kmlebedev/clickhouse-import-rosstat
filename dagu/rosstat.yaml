type: chain
schedule: "17 12 * * 4"
overlap_policy: skip

steps:
  - id: rosstat_ipc_mes
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=rosstat_ipc_mes
    retry_policy:
      limit: 3
      interval_sec: 300

  - id: rosstat_ipc_weeks
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=rosstat_ipc_weeks
    retry_policy:
      limit: 3
      interval_sec: 300

  - id: rosstat_salaries_mes
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=rosstat_salaries_mes
    retry_policy:
      limit: 3
      interval_sec: 300

  - id: rosstat_vvp_kvartal
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=rosstat_vvp_kvartal
    retry_policy:
      limit: 3
      interval_sec: 300

  - id: rosstat_labour_force_mes
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=rosstat_labour_force_mes
    retry_policy:
      limit: 3
      interval_sec: 300

  # Шестой шаг — после macro-рядов: падение нового шага не лишает данных уже проверенные пять, а
  # после первого прогона он всегда no-op по гейту, поэтому исчезновение живого буфера цепочку не ломает.
  - id: rosstat_ipc_weeks_bulletins
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=rosstat_ipc_weeks_bulletins
    retry_policy:
      limit: 3
      interval_sec: 300

  # Седьмой шаг — публичный классификатор ОКВЭД2: не зависит от macro-рядов и не меняет их.
  # Падение классификатора не лишает данных предыдущие шесть; после первого прогона —
  # HEAD-префлайт и no-op до следующего месячного выпуска.
  - id: rosstat_okved2
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=rosstat_okved2
    retry_policy:
      limit: 3
      interval_sec: 300

  # Восьмой шаг — ИЦП по ВЭД: месячная выгрузка, публикация 12–16-й рабочий день.
  # Шаг в хвосте цепочки: падение нового шага не лишает данных уже проверенные семь.
  # После первого прогона — HEAD-префлайт и no-op; окно расписания уточнит T6.
  - id: rosstat_ppi_ved
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=rosstat_ppi_ved
    retry_policy:
      limit: 3
      interval_sec: 300

