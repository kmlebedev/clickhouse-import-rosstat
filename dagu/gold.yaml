type: chain
schedule: "47 18 * * *"
overlap_policy: skip

steps:
  - id: cbr_currency_usd
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=cbr_currency_usd
    retry_policy:
      limit: 3
      interval_sec: 300

  - id: gold_prices
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=gold_prices
    retry_policy:
      limit: 3
      interval_sec: 300
