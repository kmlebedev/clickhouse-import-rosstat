type: chain
schedule: "7,37 * * * *"
overlap_policy: skip

# Ленты топ-новостей РФ-канала (девять: Интерфакс RSS, Telegram-молния
# interfaxonline, корпоративные раскрытия edisclosure (окно 20 сообщений
# ≈30 дней), РБК, два фида ЦБ РФ, TASS, две ленты smart-lab — блоги
# KonstantinLebedev и spydell-telegram) обновляются минутами, а окна лент
# конечны (Интерфакс 25 позиций, Telegram 20 сообщений (interfaxonline ≈17 ч,
# edisclosure ≈30 дней), РБК 30, ЦБ и TASS по
# 100, smart-lab по 20): прогон каждые 30 минут гарантирует, что окно не
# проскочит целиком между запусками. Режим since пишет ТОЛЬКО отсутствующие
# позиции (ключ date/source/title): полная перевыгрузка окна каждые полчаса не
# нужна, а наличие проверяется по news_events. Окно лент всё равно вычитывается
# целиком — у RSS нет «since»-параметра (лента отдаёт последние N позиций).
# Telegram-текущие сообщения upsert'ятся всегда (title фиксируется по первой
# версии, чтобы ключ news_events не разъезжался), а правки/удаления ложатся
# версиями в news_message_version. Режим all — ручной полный прогон
# (пересборка): перечитывает и пишет окно целиком. У smart-lab полный текст
# поста уходит в description (у новостных лент там краткое описание); окно
# smart-lab — 20 постов на ленту, история копится с первого прогона. Простой
# дольше окна ленты (Интерфакс/РБК/TASS ≈1–2 ч; Telegram-молния ≈17 ч;
# корпоративные раскрытия edisclosure ≈30 дней; smart-lab —
# недели и месяцы, посты идут реже) теряет позиции безвозвратно: лента
# конечна, «залечить» окно задним числом нечем, и дыру покажет ручной
# NEWS_WATCH_MODE=check (в расписании его нет). Ноль позиций или сбой ленты —
# ошибка (лента не «стареет молча»), но остальные ленты при этом пишутся;
# сбой виден в dagu.
steps:
  - id: news_watch
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=news_watch
      - NEWS_WATCH_MODE=since
    retry_policy:
      limit: 3
      interval_sec: 300
