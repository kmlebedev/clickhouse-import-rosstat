type: chain
schedule: "7,37 * * * *"
overlap_policy: skip

# Ленты топ-новостей РФ-канала обновляются минутами, а окна лент конечны
# (Интерфакс 25 позиций, РБК 30, ЦБ и TASS по 100): прогон каждые 30 минут
# гарантирует, что окно не проскочит целиком между запусками. Режим since пишет
# ТОЛЬКО отсутствующие позиции (ключ date/source/title): полная перевыгрузка окна
# каждые полчаса не нужна, а наличие проверяется по news_events. Окно лент всё
# равно вычитывается целиком — у RSS нет «since»-параметра (лента отдаёт последние
# N позиций). Режим all — ручной полный прогон (пересборка): перечитывает и пишет
# окно целиком. Простой дольше окна ленты (Интерфакс/РБК/TASS ≈1–2 ч) по-прежнему
# теряет её позиции безвозвратно: лента конечна, «залечить» окно задним числом
# нечем, и дыру покажет ручной NEWS_WATCH_MODE=check (в расписании его нет).
# Ноль позиций или сбой ленты — ошибка (лента не «стареет молча»), но остальные
# ленты при этом пишутся; сбой виден в dagu.
steps:
  - id: news_watch
    run: "$ROSSTAT_IMPORT_BIN"
    env:
      - CLICKHOUSE_IMPORT_STAT=news_watch
      - NEWS_WATCH_MODE=since
    retry_policy:
      limit: 3
      interval_sec: 300
