# goreleaser v2: бинарник linux/amd64 и контрольные суммы для релиза по тегу v*.
# После правки выполнить "goreleaser check".
version: 2

project_name: clickhouse-import-rosstat

before:
  hooks:
    - go mod download

builds:
  - id: clickhouse-import-rosstat
    main: .
    binary: clickhouse-import-rosstat
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [README.md, dagu/*.yaml]

checksum:
  name_template: SHA256SUMS

changelog:
  use: git
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']

release:
  draft: false
  prerelease: auto
